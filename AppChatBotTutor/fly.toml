app = "flask-app"  # cámbialo por el nombre que elijas en fly launch

[build]
  dockerfile = "Dockerfile"
  
[env]
  PORT = "8080"
  RASA_SERVER_URL = "https://rasa-server.fly.dev"  

# Volumen para SQLite (persistencia)
[[mounts]]
  source = "flask_data"
  destination = "/app/instance"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
	
